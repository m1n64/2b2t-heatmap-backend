services:
  caddy:
    image: caddy:2.8-alpine
    hostname: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
      target: prod
    hostname: backend
    volumes:
      - ./:/app:cached
    environment:
      GIN_MODE: "release"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: